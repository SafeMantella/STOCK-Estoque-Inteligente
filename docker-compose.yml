# Postgres + a imagem única de produção (API + frontend em http://localhost:8000).
# Defina SECRET_KEY num arquivo .env na raiz do projeto antes de subir.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/stock
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no arquivo .env da raiz do projeto}
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
