[project]
name = "stock-backend"
version = "2.0.0"
description = "STOCK - Estoque Inteligente: API FastAPI para estoque doméstico e lista de compras automática"
requires-python = ">=3.10"
# Fonte das dependências (uv.lock é usado pelo Dockerfile). requirements.txt é mantido em
# sincronia para quem instala com pip.
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic[email]==2.10.3",
    "alembic==1.14.0",
]

[tool.uv]
# Aplicação (não é um pacote instalável): `uv run` só cria o venv e instala as dependências
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
