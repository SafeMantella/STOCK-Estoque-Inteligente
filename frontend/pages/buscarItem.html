<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock :: Buscar Itens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/custom.css" rel="stylesheet">
</head>
<body>
  <br><br>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4"></div>
      <div class="col-md-4">
        <button class="btn btn-outline-success w-100 mb-2" onclick="window.location.href='../menu.html'">Voltar ao Menu</button>
        <form id="form-busca">
          <div class="mb-2">
            <label class="form-label" for="busca-descricao">Descrição:</label>
            <input type="text" name="descricao" id="busca-descricao" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label" for="busca-categoria">Categoria:</label>
            <select name="categoria" id="busca-categoria" class="form-select">
              <option value="">Todas</option>
              <option>Higiene e Limpeza</option>
              <option>Bebidas</option>
              <option>Adega</option>
              <option>Molhos e Óleos</option>
              <option>Açúcares e Doces</option>
              <option>Laticínios</option>
              <option>Carnes e Ovos</option>
              <option>Leguminosas/Hortaliças/Raízes/Tubérculos</option>
              <option>Frutas</option>
              <option>Cereais e Mel</option>
              <option>Pão e Massas</option>
              <option>Outros</option>
            </select>
          </div>
          <br>
          <button type="submit" class="btn btn-stock w-100">Buscar</button>
        </form>
      </div>
      <div class="col-md-4"></div>
    </div>

    <!-- Resultados -->
    <div class="row mt-4" id="resultado-section" style="display:none;">
      <div class="col-md-1"></div>
      <div class="col-md-10">
        <div class="d-flex flex-wrap gap-2 mb-2">
          <button class="btn btn-outline-success btn-toque" onclick="window.location.href='listarItens.html'">Todos os Itens</button>
          <button class="btn btn-outline-success btn-toque" onclick="document.getElementById('resultado-section').style.display='none'">Buscar Novamente</button>
        </div>
        <p id="contagem"></p>
        <div id="resultado-cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
      </div>
      <div class="col-md-1"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    requireAuth();

    document.getElementById('form-busca').addEventListener('submit', async function(e) {
      e.preventDefault();
      const params = new URLSearchParams();
      if (this.descricao.value) params.set('descricao',  this.descricao.value);
      if (this.categoria.value) params.set('categoria',  this.categoria.value);
      try {
        const itens = await apiCall('GET', '/items?' + params);
        await renderCatalogo(document.getElementById('resultado-cards'), document.getElementById('contagem'),
          itens, 'Nenhum item encontrado. Confira o nome ou cadastre o item em "Cadastrar Novo Item".');
        const secao = document.getElementById('resultado-section');
        secao.style.display = 'block';
        secao.scrollIntoView({ block: 'start' });
      } catch (err) {
        showMsg(err.message);
      }
    });

  </script>
</body>
</html>
