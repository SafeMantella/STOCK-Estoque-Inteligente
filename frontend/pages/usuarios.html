<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock :: Casa e convites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/custom.css" rel="stylesheet">
</head>
<body>
  <br><br>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-1"></div>
      <div class="col-md-10">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <button class="btn btn-outline-success btn-toque" onclick="window.location.href='../menu.html'">Voltar ao Menu</button>
          <h1 class="h4 mb-0 ms-1">Casa e convites</h1>
        </div>
        <h2 class="h5" id="nome-estoque"></h2>
        <p id="so-dono" class="fw-normal" style="display:none;"></p>

        <div id="convite-section" class="card mb-3" style="display:none;">
          <div class="card-body">
            <h6 class="card-title">Convidar alguém da sua casa</h6>
            <p class="small mb-2">O convite vale por 7 dias e pode ser usado uma única vez.</p>
            <button class="btn btn-stock mb-2" id="btn-gerar-convite">Gerar código de convite</button>
            <div id="convite-resultado" style="display:none;">
              <label class="form-label mb-0" for="convite-codigo">Código do convite:</label>
              <div class="input-group mb-2">
                <input type="text" id="convite-codigo" class="form-control" readonly>
                <button class="btn btn-outline-success btn-toque" data-copy="convite-codigo" aria-label="Copiar código do convite">Copiar</button>
              </div>
              <label class="form-label mb-0" for="convite-link">Link para a pessoa aceitar o convite:</label>
              <div class="input-group mb-1">
                <input type="text" id="convite-link" class="form-control" readonly>
                <button class="btn btn-outline-success btn-toque" data-copy="convite-link" aria-label="Copiar link do convite">Copiar</button>
              </div>
              <small id="convite-expira"></small>
            </div>
          </div>
        </div>

        <div id="entrar" class="card mb-3" style="display:none;">
          <div class="card-body">
            <h6 class="card-title" id="entrar-titulo">Recebeu um convite de outra casa?</h6>
            <p class="small fw-normal mb-2" id="entrar-texto">Cole o código que a pessoa gerou em "Casa e convites".</p>
            <form id="form-entrar" class="input-group">
              <input type="text" name="codigo_convite" class="form-control" placeholder="Código de convite" required autocomplete="off" aria-label="Código de convite">
              <button type="submit" class="btn btn-outline-success btn-toque">Entrar</button>
            </form>
            <div id="convite-info" class="small mt-2" aria-live="polite"></div>
            <small id="entrar-aviso" class="fw-normal">Atenção: você sai da sua casa atual.</small>
          </div>
        </div>

        <p id="contagem"></p>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr class="table-active">
                <th>Nome</th><th>E-mail</th>
              </tr>
            </thead>
            <tbody id="tabela-usuarios"></tbody>
          </table>
        </div>
      </div>
      <div class="col-md-1"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    requireAuth();

    async function carregarUsuarios() {
      try {
        // local=true filtra apenas usuários do estoque do usuário logado
        const users = await apiCall('GET', '/users?local=true');
        document.getElementById('contagem').textContent =
          users.length + (users.length === 1 ? ' morador nesta casa.' : ' moradores nesta casa.');
        const tbody = document.getElementById('tabela-usuarios');
        tbody.innerHTML = '';
        users.forEach(u => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${esc(u.nome)}</td><td>${esc(u.email)}</td>`;
          tbody.appendChild(tr);
        });
      } catch (err) {
        showMsg(err.message);
      }
    }

    async function carregarEstoque() {
      try {
        const e = await apiCall('GET', '/estoque/meu');
        document.getElementById('nome-estoque').textContent =
          'Casa: ' + e.descricao + (e.sou_dono ? ' (você é o dono)' : '');
        document.getElementById('convite-section').style.display = e.sou_dono ? 'block' : 'none';
        // Morador: explica por que não aparece a opção de convidar
        const soDono = document.getElementById('so-dono');
        soDono.textContent = e.dono_nome
          ? 'Só ' + e.dono_nome + ' (dono/a) pode convidar novos moradores.'
          : 'Só quem é dono/a da casa pode convidar novos moradores.';
        soDono.style.display = e.sou_dono ? 'none' : 'block';
        // Só mostra "aceitar convite" para quem pode trocar sem deixar um estoque órfão
        document.getElementById('entrar').style.display = e.pode_trocar ? 'block' : 'none';
        if (e.sou_dono && e.itens === 0 && e.membros === 1) {
          document.getElementById('entrar-titulo').textContent = 'Tenho um código de convite';
          document.getElementById('entrar-texto').textContent =
            'Se alguém da sua casa já usa o STOCK, cole aqui o código que a pessoa gerou para usar o mesmo estoque.';
          document.getElementById('entrar-aviso').textContent =
            'Sua casa atual está vazia e será deixada para trás.';
        }
        const conviteUrl = new URLSearchParams(location.search).get('convite');
        if (conviteUrl) {
          if (e.pode_trocar) {
            document.querySelector('#form-entrar [name=codigo_convite]').value = conviteUrl;
            const info = await consultarConvite(conviteUrl);
            if (info) showMsg('Convite para "' + info.descricao + '"' + (info.dono_nome ? ' (de ' + info.dono_nome + ')' : '') +
              '. Clique em "Entrar" para aceitar.', 'info');
          } else {
            showMsg('Você é dono de um estoque que já tem itens ou outros moradores, por isso não pode aceitar este convite com esta conta. Use outra conta.', 'warning');
          }
        }
      } catch (err) {
        showMsg(err.message);
      }
    }

    document.getElementById('btn-gerar-convite').addEventListener('click', async () => {
      try {
        const c = await apiCall('POST', '/estoque/convites');
        document.getElementById('convite-codigo').value = c.codigo;
        document.getElementById('convite-link').value =
          location.origin + '/pages/cadastroUsuario.html?convite=' + encodeURIComponent(c.codigo);
        document.getElementById('convite-expira').textContent =
          'Expira em: ' + new Date(c.expira_em).toLocaleString('pt-BR');
        document.getElementById('convite-resultado').style.display = 'block';
      } catch (err) {
        showMsg(err.message);
      }
    });

    document.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', async () => {
      const input = document.getElementById(btn.dataset.copy);
      input.select();
      try { await navigator.clipboard.writeText(input.value); } catch (_) { document.execCommand('copy'); }
      showMsg('Copiado!', 'success');
    }));

    // Confere o convite no servidor (casa e dono) sem aceitar; mostra o erro se não servir
    async function consultarConvite(codigo) {
      try {
        return await apiCall('GET', '/estoque/convites/' + encodeURIComponent(codigo));
      } catch (err) {
        showMsg(err.message);
        return null;
      }
    }

    document.getElementById('form-entrar').addEventListener('submit', async function(e) {
      e.preventDefault();
      const codigo = this.codigo_convite.value.trim();
      const info = await consultarConvite(codigo);
      if (!info) return;
      const dono = info.dono_nome ? ' (de ' + info.dono_nome + ')' : '';
      if (!confirm('Entrar em "' + info.descricao + '"' + dono + '?\n\nVocê sai da sua casa atual e passa a usar o estoque e a lista de compras de "' + info.descricao + '".')) return;
      try {
        const est = await apiCall('POST', '/estoque/entrar', { codigo_convite: codigo });
        localStorage.setItem('cod_estoque', est.cod_estoque);
        showMsg('Pronto! Agora você faz parte de "' + est.descricao + '".', 'success');
        this.reset();
        history.replaceState(null, '', location.pathname);
        carregarEstoque();
        carregarUsuarios();
      } catch (err) {
        showMsg(err.message);
      }
    });

    carregarEstoque();
    carregarUsuarios();
  </script>
</body>
</html>
