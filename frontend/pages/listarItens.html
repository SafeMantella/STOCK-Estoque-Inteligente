<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock :: Listar Itens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/custom.css" rel="stylesheet">
</head>
<body>
  <br><br>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-1"></div>
      <div class="col-md-10">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
          <button class="btn btn-outline-success btn-toque" onclick="window.location.href='../menu.html'">Voltar ao Menu</button>
          <button class="btn btn-outline-success btn-toque" onclick="window.location.href='buscarItem.html'">Buscar Itens</button>
        </div>
        <h1 class="h4 mt-2">Catálogo da casa</h1>
        <p class="fw-normal mb-2">Itens já cadastrados por alguém da casa. Adicione ao estoque os que você quer controlar.</p>
        <p id="contagem" class="mb-3"></p>
        <div id="catalogo-cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
        <div id="catalogo-vazio" class="text-center py-4" style="display:none;">
          <a href="cadastroItem.html" class="btn btn-stock btn-toque">Cadastrar item</a>
        </div>
      </div>
      <div class="col-md-1"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    requireAuth();

    async function carregarItens() {
      try {
        const itens = await apiCall('GET', '/items');
        const n = await renderCatalogo(document.getElementById('catalogo-cards'), document.getElementById('contagem'),
          itens, 'Nenhum item no catálogo da casa ainda.');
        document.getElementById('catalogo-vazio').style.display = n ? 'none' : 'block';
      } catch (err) {
        showMsg(err.message);
      }
    }

    carregarItens();
  </script>
</body>
</html>
